    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nam Việt Group</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />

      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
    />
    <script>
      (function () {
        try {
          localStorage.setItem('nv-dark', 'false');
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        } catch (e) {}
        // Wake Render before JS parses — first /health pays cold start, /api/auth/* can reuse the dyno.
        try {
          fetch('/health', { cache: 'no-store', credentials: 'omit', keepalive: true }).catch(function () {});
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!--
      THESIS: NamViet ERP is a site-cabin instrument, not a washed MD3 admin. Refuse pills, pastel navy, and Roboto-on-gray.
      OWN-WORLD: Gunmetal chrome, bone paper, Be Vietnam Pro, squared 6px keycaps; safety orange commits; amber is live state.
      STORY: Thủ kho / cung ứng scan a dense table, trust status color, press the orange key to chốt phiếu.
      FIRST VIEWPORT: Ink header with amber lip, solid gunmetal sidebar with lit active key, bone page, navy table stamp header, orange primary action top-right.
      FORM: Cabin desk (assigned 5) fused with creator-hardware-bench; seed 4afbeea0.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->

    <script type="module" src="/src/main.tsx"></script>
  </body>
