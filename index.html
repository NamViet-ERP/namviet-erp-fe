<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/hrm.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nam Việt Group</title>
    <script>
      (function () {
        try {
          if (localStorage.getItem('nv-dark') === 'true') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
