<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/mayzer-favicon.png?v=20260815" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mayzer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Font + màu: src/styles/tokens.css (:root KNOBS). File chữ load từ @import trong file đó. -->
    <script>
      (function () {
        try {
          localStorage.setItem('nv-dark', 'false');
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        } catch (e) {}
        // Wake Render before JS parses — first /health pays cold start, /api/auth/* can reuse the dyno.
        try {
          fetch('/health', { cache: 'no-store', credentials: 'omit', keepalive: true }).catch(function () {});
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!--
      THESIS: Mayzer ERP is a dense operator console. Theme lives in src/styles/tokens.css (:root).
      OWN-WORLD: Navy chrome, cool gray paper, white cards; primary = --nv-action.
      STORY: Thủ kho / cung ứng scan a dense table, trust status color, press the primary key to chốt phiếu.
      FIRST VIEWPORT: Navy header, solid navy sidebar, gray page, white panels, navy table stamp.
      FORM: Cabin desk (assigned 5) fused with creator-hardware-bench; seed 4afbeea0.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
