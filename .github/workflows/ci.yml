# Runs on branch `production` — change `branches` when you switch to main/master.
name: CI

on:
  push:
    branches: [production]
  pull_request:
    branches: [production]

jobs:
  frontend:
    name: FE production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Write .env.production for CI build
        run: |
          printf '%s\n' \
            'VITE_API_BASE_URL=https://api.ci-placeholder.local' \
            'VITE_USE_MOCK=false' \
            > .env.production

      - name: Verify production env
        run: npm run verify:prod-env
        env:
          VITE_USE_MOCK: 'false'
          VITE_API_BASE_URL: https://api.ci-placeholder.local

      - name: Production build
        run: npm run build:prod
        env:
          VITE_USE_MOCK: 'false'
          VITE_API_BASE_URL: https://api.ci-placeholder.local

      - name: Unit tests
        run: rm -f .env.production && npm run test:run
        env:
          NODE_ENV: test
          VITE_USE_MOCK: 'true'
