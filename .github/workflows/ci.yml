# Runs on production + feature branches used for purchasing work.
name: CI

on:
  push:
    branches: [production, feature/purchasing]
  pull_request:
    branches: [production, feature/purchasing]

jobs:
  frontend:
    name: FE production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: OpenAPI generated types in sync
        run: npm run api:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:run
        env:
          NODE_ENV: test

      - name: Write .env.production for CI build (same-origin)
        run: |
          printf '%s\n' \
            'VITE_API_BASE_URL=' \
            'VITE_BASE_PATH=/' \
            > .env.production

      - name: Verify production env
        run: npm run verify:prod
        env:
          VITE_API_BASE_URL: ''

      - name: Production build
        run: npm run build:prod
        env:
          VITE_API_BASE_URL: ''

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: fe-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
