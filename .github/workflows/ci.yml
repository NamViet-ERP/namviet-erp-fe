# Runs on branch `production` — change `branches` when you switch to main/master.
name: CI

on:
  push:
    branches: [production]
  pull_request:
    branches: [production]

jobs:
  frontend:
    name: FE production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: OpenAPI generated types in sync
        run: npm run api:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:run
        env:
          NODE_ENV: test

      - name: Write .env.production for CI build
        run: |
          printf '%s\n' \
            'VITE_API_BASE_URL=https://api.ci-placeholder.local' \
            > .env.production

      - name: Verify production env
        run: npm run verify:prod
        env:
          VITE_API_BASE_URL: https://api.ci-placeholder.local

      - name: Production build
        run: npm run build:prod
        env:
          VITE_API_BASE_URL: https://api.ci-placeholder.local
