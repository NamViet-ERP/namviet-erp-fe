# Runs on branch `production` — change `branches` here when you switch to main/master.
name: CI

on:
  push:
    branches: [production]
  pull_request:
    branches: [production]

jobs:
  frontend:
    name: FE production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Verify production env
        run: npm run verify:prod-env
        env:
          VITE_USE_MOCK: 'false'
          VITE_API_BASE_URL: https://api.ci-placeholder.local

      - name: Production build
        run: npm run build:prod
        env:
          VITE_USE_MOCK: 'false'
          VITE_API_BASE_URL: https://api.ci-placeholder.local

      - name: Unit tests
        run: npm run test:run
